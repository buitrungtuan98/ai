name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 40              # a hung runner fails the run instead of blocking a merge for hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ffmpeg lets the render integration test run (it self-skips when absent). An apt mirror can
      # hang (R35: one run sat 25 min here), so each attempt is time-boxed and retried.
      - name: Install ffmpeg
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            timeout 240 sudo apt-get update -o Acquire::Retries=3 \
              && timeout 300 sudo apt-get install -y -o Acquire::Retries=3 ffmpeg && exit 0
            echo "apt attempt $i failed, retrying…"; sleep $((i * 10))
          done
          exit 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        # conftest.py generates a throwaway FERNET_KEY and points the DB at a temp file,
        # so the suite runs with no real secrets or external services.
        run: pytest -q
